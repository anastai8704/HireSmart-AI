name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/hiresmart_test
      JWT_SECRET: ci_only_secret_at_least_32_characters_long
      REQUIRE_EMAIL_VERIFICATION: "false"
      STORAGE_PROVIDER: local
      PROCESS_JOBS_INLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm run check
        working-directory: server

      - run: npm run lint
        working-directory: server

      - run: npm run indexes:create
        working-directory: server

      - run: npm test
        working-directory: server

      - run: npm audit --omit=dev --audit-level=high
        working-directory: server

      # Requirement 9: dry run only, against a disposable database. The report is uploaded for review.
      - name: Employment migration dry run (disposable database)
        run: npm run migrate:employment
        working-directory: server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/hiresmart_migration_dry_run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employment-migration-dry-run
          path: server/backups/employment-migration-dry-run-*.json
          if-no-files-found: ignore

  frontend-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm test
        working-directory: client

      - run: npm run build
        working-directory: client

  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/hiresmart_e2e
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm ci
        working-directory: client

      # A fresh demo password for every run. It is never stored in the repository.
      - name: Create a per-run demo password
        run: echo "DEMO_PASSWORD=$(openssl rand -hex 18)" >> "$GITHUB_ENV"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Browser end-to-end tests
        run: npm run e2e
        working-directory: client

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
