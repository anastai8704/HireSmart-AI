# Nginx configuration for the production frontend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Typically cuts transfer size by ~70%.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Basic security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed asset filenames change whenever content changes, so they can be
    # cached forever. This is why Vite puts a hash in every filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Forward API calls to the backend container.
    #
    # This is the production equivalent of Vite's dev proxy: the browser only
    # ever talks to this one origin, so there is no CORS configuration to get
    # wrong and no backend hostname baked into the JavaScript.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resume uploads can be a few MB.
        client_max_body_size 10M;
    }

    # SINGLE-PAGE APP FALLBACK - the most important line in this file.
    #
    # React Router handles /jobs/123 in the browser, but that file does not
    # exist on disk. Without this, refreshing any page except "/" returns 404.
    # We serve index.html instead and let React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
