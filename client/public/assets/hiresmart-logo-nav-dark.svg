<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56" role="img" aria-label="HireSmart AI">
  <defs>
    <linearGradient id="hs-nav-cyan-top-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-mid-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-glow-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-left-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-deep-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-right-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-dark-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="14" y="40" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8" fill="#0f172a">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (integrated seamlessly between HireSmart and AI) -->
    <g id="diamond-cube">
      <polygon points="224,10.00 216.21,14.50 224,19.00" fill="url(#hs-nav-cyan-top-dark)" />
      <polygon points="224,10.00 231.79,14.50 224,19.00" fill="url(#hs-nav-cyan-mid-dark)" />
      <polygon points="216.21,14.50 208.41,19.00 224,28.00 224,19.00" fill="url(#hs-nav-cyan-glow-dark)" />
      <polygon points="231.79,14.50 239.59,19.00 224,28.00 224,19.00" fill="url(#hs-nav-cyan-top-dark)" />
      <polygon points="208.41,19.00 208.41,28.00 224,28.00" fill="url(#hs-nav-cyan-mid-dark)" />
      <polygon points="208.41,28.00 208.41,37.00 216.21,32.50 224,28.00" fill="url(#hs-nav-blue-left-dark)" />
      <polygon points="208.41,37.00 216.21,41.50 224,28.00" fill="url(#hs-nav-blue-deep-dark)" />
      <polygon points="216.21,41.50 224,46.00 224,28.00" fill="url(#hs-nav-blue-left-dark)" />
      <polygon points="239.59,19.00 239.59,28.00 224,28.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="239.59,28.00 239.59,37.00 231.79,32.50 224,28.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="239.59,37.00 231.79,41.50 224,28.00" fill="url(#hs-nav-blue-dark-dark)" />
      <polygon points="231.79,41.50 224,46.00 224,28.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="224,19.00 224,28.00 216.21,14.50" fill="#ffffff" opacity="0.45" />
      <polygon points="224,19.00 224,28.00 231.79,14.50" fill="#bae6fd" opacity="0.3" />
      <line x1="224" y1="10.00" x2="224" y2="28.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="208.41" y1="19.00" x2="224" y2="28.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="239.59" y1="19.00" x2="224" y2="28.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="224" y1="46.00" x2="224" y2="28.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark -->
    <text x="248" y="40" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8" fill="#0f172a">AI</text>
  </g>
</svg>