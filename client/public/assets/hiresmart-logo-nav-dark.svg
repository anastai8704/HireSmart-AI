<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" width="280" height="52" role="img" aria-label="HireSmart AI">
  <defs>
    <linearGradient id="hs-nav-cyan-top-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-mid-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-glow-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-left-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-deep-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-right-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-dark-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="12" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.6" fill="#0f172a">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (close, balanced, non-overlapping spacing) -->
    <g id="diamond-cube">
      <polygon points="207,9.50 199.86,13.63 207,17.75" fill="url(#hs-nav-cyan-top-dark)" />
      <polygon points="207,9.50 214.14,13.63 207,17.75" fill="url(#hs-nav-cyan-mid-dark)" />
      <polygon points="199.86,13.63 192.71,17.75 207,26.00 207,17.75" fill="url(#hs-nav-cyan-glow-dark)" />
      <polygon points="214.14,13.63 221.29,17.75 207,26.00 207,17.75" fill="url(#hs-nav-cyan-top-dark)" />
      <polygon points="192.71,17.75 192.71,26.00 207,26.00" fill="url(#hs-nav-cyan-mid-dark)" />
      <polygon points="192.71,26.00 192.71,34.25 199.86,30.13 207,26.00" fill="url(#hs-nav-blue-left-dark)" />
      <polygon points="192.71,34.25 199.86,38.38 207,26.00" fill="url(#hs-nav-blue-deep-dark)" />
      <polygon points="199.86,38.38 207,42.50 207,26.00" fill="url(#hs-nav-blue-left-dark)" />
      <polygon points="221.29,17.75 221.29,26.00 207,26.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="221.29,26.00 221.29,34.25 214.14,30.13 207,26.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="221.29,34.25 214.14,38.38 207,26.00" fill="url(#hs-nav-blue-dark-dark)" />
      <polygon points="214.14,38.38 207,42.50 207,26.00" fill="url(#hs-nav-blue-right-dark)" />
      <polygon points="207,17.75 207,26.00 199.86,13.63" fill="#ffffff" opacity="0.45" />
      <polygon points="207,17.75 207,26.00 214.14,13.63" fill="#bae6fd" opacity="0.3" />
      <line x1="207" y1="9.50" x2="207" y2="26.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="192.71" y1="17.75" x2="207" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="221.29" y1="17.75" x2="207" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="207" y1="42.50" x2="207" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark -->
    <text x="227" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.6" fill="#0f172a">AI</text>
  </g>
</svg>