<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="HireSmart AI — Hire Smarter • Build Better">
  <defs>
    <linearGradient id="hs-full-cyan-top-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-mid-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-glow-light" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-full-blue-left-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-full-blue-deep-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-full-blue-right-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-full-blue-dark-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="14" y="36" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#ffffff">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (small gap, zero overlap) -->
    <g id="diamond-cube">
      <polygon points="202,8.50 194.86,12.63 202,16.75" fill="url(#hs-full-cyan-top-light)" />
      <polygon points="202,8.50 209.14,12.63 202,16.75" fill="url(#hs-full-cyan-mid-light)" />
      <polygon points="194.86,12.63 187.71,16.75 202,25.00 202,16.75" fill="url(#hs-full-cyan-glow-light)" />
      <polygon points="209.14,12.63 216.29,16.75 202,25.00 202,16.75" fill="url(#hs-full-cyan-top-light)" />
      <polygon points="187.71,16.75 187.71,25.00 202,25.00" fill="url(#hs-full-cyan-mid-light)" />
      <polygon points="187.71,25.00 187.71,33.25 194.86,29.13 202,25.00" fill="url(#hs-full-blue-left-light)" />
      <polygon points="187.71,33.25 194.86,37.38 202,25.00" fill="url(#hs-full-blue-deep-light)" />
      <polygon points="194.86,37.38 202,41.50 202,25.00" fill="url(#hs-full-blue-left-light)" />
      <polygon points="216.29,16.75 216.29,25.00 202,25.00" fill="url(#hs-full-blue-right-light)" />
      <polygon points="216.29,25.00 216.29,33.25 209.14,29.13 202,25.00" fill="url(#hs-full-blue-right-light)" />
      <polygon points="216.29,33.25 209.14,37.38 202,25.00" fill="url(#hs-full-blue-dark-light)" />
      <polygon points="209.14,37.38 202,41.50 202,25.00" fill="url(#hs-full-blue-right-light)" />
      <polygon points="202,16.75 202,25.00 194.86,12.63" fill="#ffffff" opacity="0.45" />
      <polygon points="202,16.75 202,25.00 209.14,12.63" fill="#bae6fd" opacity="0.3" />
      <line x1="202" y1="8.50" x2="202" y2="25.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="187.71" y1="16.75" x2="202" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="216.29" y1="16.75" x2="202" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="202" y1="41.50" x2="202" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark -->
    <text x="222" y="36" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#ffffff">AI</text>

    <!-- Tagline: HIRE SMARTER • BUILD BETTER -->
    <line x1="14" y1="60" x2="58" y2="60" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" stroke-linecap="round" />
    <text x="66" y="63" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.4" fill="#94a3b8">HIRE SMARTER  •  BUILD BETTER</text>
    <line x1="242" y1="60" x2="286" y2="60" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>