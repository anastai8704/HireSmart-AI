<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 52" width="256" height="52" role="img" aria-label="HireSmart AI">
  <defs>
    <linearGradient id="hs-nav-cyan-top-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-mid-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-nav-cyan-glow-light" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-left-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-deep-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-right-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-nav-blue-dark-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="10" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.6" fill="#ffffff">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (tight, reduced spacing, no overlap) -->
    <g id="diamond-cube">
      <polygon points="195,9.50 187.86,13.63 195,17.75" fill="url(#hs-nav-cyan-top-light)" />
      <polygon points="195,9.50 202.14,13.63 195,17.75" fill="url(#hs-nav-cyan-mid-light)" />
      <polygon points="187.86,13.63 180.71,17.75 195,26.00 195,17.75" fill="url(#hs-nav-cyan-glow-light)" />
      <polygon points="202.14,13.63 209.29,17.75 195,26.00 195,17.75" fill="url(#hs-nav-cyan-top-light)" />
      <polygon points="180.71,17.75 180.71,26.00 195,26.00" fill="url(#hs-nav-cyan-mid-light)" />
      <polygon points="180.71,26.00 180.71,34.25 187.86,30.13 195,26.00" fill="url(#hs-nav-blue-left-light)" />
      <polygon points="180.71,34.25 187.86,38.38 195,26.00" fill="url(#hs-nav-blue-deep-light)" />
      <polygon points="187.86,38.38 195,42.50 195,26.00" fill="url(#hs-nav-blue-left-light)" />
      <polygon points="209.29,17.75 209.29,26.00 195,26.00" fill="url(#hs-nav-blue-right-light)" />
      <polygon points="209.29,26.00 209.29,34.25 202.14,30.13 195,26.00" fill="url(#hs-nav-blue-right-light)" />
      <polygon points="209.29,34.25 202.14,38.38 195,26.00" fill="url(#hs-nav-blue-dark-light)" />
      <polygon points="202.14,38.38 195,42.50 195,26.00" fill="url(#hs-nav-blue-right-light)" />
      <polygon points="195,17.75 195,26.00 187.86,13.63" fill="#ffffff" opacity="0.45" />
      <polygon points="195,17.75 195,26.00 202.14,13.63" fill="#bae6fd" opacity="0.3" />
      <line x1="195" y1="9.50" x2="195" y2="26.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="180.71" y1="17.75" x2="195" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="209.29" y1="17.75" x2="195" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="195" y1="42.50" x2="195" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark (tight spacing, right next to diamond) -->
    <text x="212" y="37" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.6" fill="#ffffff">AI</text>
  </g>
</svg>