<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 86" width="340" height="86" role="img" aria-label="HireSmart AI — Hire Smarter • Build Better">
  <defs>
    <linearGradient id="hs-full-cyan-top-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-mid-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-glow-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-full-blue-left-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-full-blue-deep-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-full-blue-right-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-full-blue-dark-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="18" y="38" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#0f172a">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (integrated seamlessly between HireSmart and AI) -->
    <g id="diamond-cube">
      <polygon points="236,8.00 228.21,12.50 236,17.00" fill="url(#hs-full-cyan-top-dark)" />
      <polygon points="236,8.00 243.79,12.50 236,17.00" fill="url(#hs-full-cyan-mid-dark)" />
      <polygon points="228.21,12.50 220.41,17.00 236,26.00 236,17.00" fill="url(#hs-full-cyan-glow-dark)" />
      <polygon points="243.79,12.50 251.59,17.00 236,26.00 236,17.00" fill="url(#hs-full-cyan-top-dark)" />
      <polygon points="220.41,17.00 220.41,26.00 236,26.00" fill="url(#hs-full-cyan-mid-dark)" />
      <polygon points="220.41,26.00 220.41,35.00 228.21,30.50 236,26.00" fill="url(#hs-full-blue-left-dark)" />
      <polygon points="220.41,35.00 228.21,39.50 236,26.00" fill="url(#hs-full-blue-deep-dark)" />
      <polygon points="228.21,39.50 236,44.00 236,26.00" fill="url(#hs-full-blue-left-dark)" />
      <polygon points="251.59,17.00 251.59,26.00 236,26.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="251.59,26.00 251.59,35.00 243.79,30.50 236,26.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="251.59,35.00 243.79,39.50 236,26.00" fill="url(#hs-full-blue-dark-dark)" />
      <polygon points="243.79,39.50 236,44.00 236,26.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="236,17.00 236,26.00 228.21,12.50" fill="#ffffff" opacity="0.45" />
      <polygon points="236,17.00 236,26.00 243.79,12.50" fill="#bae6fd" opacity="0.3" />
      <line x1="236" y1="8.00" x2="236" y2="26.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="220.41" y1="17.00" x2="236" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="251.59" y1="17.00" x2="236" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="236" y1="44.00" x2="236" y2="26.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark -->
    <text x="260" y="38" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#0f172a">AI</text>

    <!-- Tagline: HIRE SMARTER • BUILD BETTER -->
    <line x1="18" y1="65" x2="68" y2="65" stroke="rgba(15, 23, 42, 0.25)" stroke-width="1.2" stroke-linecap="round" />
    <text x="76" y="68" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.6" fill="#64748b">HIRE SMARTER  •  BUILD BETTER</text>
    <line x1="272" y1="65" x2="322" y2="65" stroke="rgba(15, 23, 42, 0.25)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>