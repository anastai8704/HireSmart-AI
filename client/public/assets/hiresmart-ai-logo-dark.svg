<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="HireSmart AI — Hire Smarter • Build Better">
  <defs>
    <linearGradient id="hs-full-cyan-top-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-mid-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hs-full-cyan-glow-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="hs-full-blue-left-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hs-full-blue-deep-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="hs-full-blue-right-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="hs-full-blue-dark-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g id="hiresmart-brand-artwork">
    <!-- HireSmart wordmark -->
    <text x="14" y="36" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#0f172a">HireSmart</text>

    <!-- 3D Geometric Faceted Diamond/Cube (tight, close, balanced integration) -->
    <g id="diamond-cube">
      <polygon points="195,8.50 187.86,12.63 195,16.75" fill="url(#hs-full-cyan-top-dark)" />
      <polygon points="195,8.50 202.14,12.63 195,16.75" fill="url(#hs-full-cyan-mid-dark)" />
      <polygon points="187.86,12.63 180.71,16.75 195,25.00 195,16.75" fill="url(#hs-full-cyan-glow-dark)" />
      <polygon points="202.14,12.63 209.29,16.75 195,25.00 195,16.75" fill="url(#hs-full-cyan-top-dark)" />
      <polygon points="180.71,16.75 180.71,25.00 195,25.00" fill="url(#hs-full-cyan-mid-dark)" />
      <polygon points="180.71,25.00 180.71,33.25 187.86,29.13 195,25.00" fill="url(#hs-full-blue-left-dark)" />
      <polygon points="180.71,33.25 187.86,37.38 195,25.00" fill="url(#hs-full-blue-deep-dark)" />
      <polygon points="187.86,37.38 195,41.50 195,25.00" fill="url(#hs-full-blue-left-dark)" />
      <polygon points="209.29,16.75 209.29,25.00 195,25.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="209.29,25.00 209.29,33.25 202.14,29.13 195,25.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="209.29,33.25 202.14,37.38 195,25.00" fill="url(#hs-full-blue-dark-dark)" />
      <polygon points="202.14,37.38 195,41.50 195,25.00" fill="url(#hs-full-blue-right-dark)" />
      <polygon points="195,16.75 195,25.00 187.86,12.63" fill="#ffffff" opacity="0.45" />
      <polygon points="195,16.75 195,25.00 202.14,12.63" fill="#bae6fd" opacity="0.3" />
      <line x1="195" y1="8.50" x2="195" y2="25.00" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
      <line x1="180.71" y1="16.75" x2="195" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="209.29" y1="16.75" x2="195" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
      <line x1="195" y1="41.50" x2="195" y2="25.00" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.35" />
    </g>

    <!-- AI wordmark -->
    <text x="214" y="36" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6" fill="#0f172a">AI</text>

    <!-- Tagline: HIRE SMARTER • BUILD BETTER -->
    <line x1="14" y1="60" x2="58" y2="60" stroke="rgba(15, 23, 42, 0.25)" stroke-width="1.2" stroke-linecap="round" />
    <text x="66" y="63" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.4" fill="#64748b">HIRE SMARTER  •  BUILD BETTER</text>
    <line x1="242" y1="60" x2="286" y2="60" stroke="rgba(15, 23, 42, 0.25)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>